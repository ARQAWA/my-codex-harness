[package]
name = "kimi-codex-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "fs"] }
axum = { version = "=0.8.9", features = ["json"] }
tokio-tungstenite = { version = "=0.29.0", features = ["rustls-tls-native-roots"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream", "json"] }
eventsource-stream = "=0.2.3"
futures-util = "=0.3.34"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
base64 = "=0.23.1"
uuid = { version = "=1.26.1", features = ["v4"] }

interface:
  display_name: "ToSpec"
  short_description: "Спека и план через карточки; запуск — «Запустить» или +++"
  default_prompt: "Используй $tospec: исследуй задачу, согласуй спеку карточками, подготовь план с Light и Blind Review; после готовности «Запустить» в карточке или отдельное +++ запускает выполнение с High Review."
policy:
  allow_implicit_invocation: false

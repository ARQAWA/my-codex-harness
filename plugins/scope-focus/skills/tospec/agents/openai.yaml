interface:
  display_name: "ToSpec"
  short_description: "Готовит спеку и план; +++ запускает выполнение"
  default_prompt: "Используй $tospec: исследуй задачу, согласуй спеку, подготовь план и проведи обе пары Spotty; после готовности объясни запуск отдельным +++ с Goal и слепой приёмкой; Notebook и очистка текущей задачи применяются по потребности, загружая инструкции по этапам."
policy:
  allow_implicit_invocation: false

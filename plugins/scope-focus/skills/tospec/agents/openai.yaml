interface:
  display_name: "ToSpec"
  short_description: "Согласует спеку и подготовит исполнимый план"
  default_prompt: "Используй $tospec: загружай вложенные инструкции по этапам, исследуй проблему и согласуй решение. После согласия проверь спеку двумя параллельными Spotty; затем подготовь план со встроенными задачами и проверь его двумя параллельными Spotty по спеке и полным Working Standards."
policy:
  allow_implicit_invocation: false
